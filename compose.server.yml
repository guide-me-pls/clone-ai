name: clone-ai

services:
  clone-ai:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/server.env
    environment:
      CLONE_AI_DATA_DIR: /data
      CLONE_AI_WORKSPACE: /workspace
      CLONE_AI_PORT: "4317"
      CLONE_AI_WHATSAPP_PORT: "4318"
      CLONE_AI_WHATSAPP_HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - clone_data:/data
      - clone_workspace:/workspace
    expose:
      - "4317"
      - "4318"
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      clone-ai:
        condition: service_healthy
    env_file:
      - ./deploy/server.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

volumes:
  clone_data:
  clone_workspace:
  caddy_data:
  caddy_config:
