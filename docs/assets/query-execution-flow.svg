<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Clone AI Query execution flow</title>
  <desc id="desc">A five-stage flow from a trigger through context, planning, governance, execution and memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .subtitle { font: 400 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #526076; }
      .stage { font: 700 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .label { font: 700 17px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #172033; }
      .body { font: 400 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .note { font: 600 13px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f766e; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .inside { fill: none; stroke: #94a3b8; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#f8fafc"/>
  <text x="70" y="62" class="title">Clone AI · 从需求到可验证结果</text>
  <text x="70" y="93" class="subtitle">Supervisor owns state, permission and completion. Agents only perform bounded work.</text>

  <g transform="translate(60 145)">
    <text x="20" y="0" class="stage">1 · 触发 Trigger</text>
    <rect x="0" y="22" width="235" height="162" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="67" class="label">Query / Schedule</text>
    <text x="24" y="94" class="label">Signal / Manual</text>
    <text x="24" y="128" class="body">用户请求、定时任务、</text>
    <text x="24" y="150" class="body">生活信号或手动操作</text>
  </g>

  <g transform="translate(355 145)">
    <text x="20" y="0" class="stage">2 · 上下文 Context</text>
    <rect x="0" y="22" width="235" height="72" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="20" y="53" class="label">创建 Task + Run</text>
    <text x="20" y="76" class="body">写入不可变事件日志</text>
    <path d="M117 94 L117 122" class="inside"/>
    <rect x="0" y="136" width="235" height="92" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="20" y="171" class="label">召回本地 Memory</text>
    <text x="20" y="197" class="body">只提供上下文，不提供权限</text>
  </g>

  <g transform="translate(650 145)">
    <text x="20" y="0" class="stage">3 · 规划 Planning</text>
    <rect x="0" y="22" width="235" height="72" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
    <text x="20" y="53" class="label">选择 Planner</text>
    <text x="20" y="76" class="body">LLM opt-in / Demo fallback</text>
    <path d="M117 94 L117 122" class="inside"/>
    <rect x="0" y="136" width="235" height="112" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
    <text x="20" y="171" class="label">校验并挂载 WorkPlan</text>
    <text x="20" y="198" class="body">PlanStep + WorkOrder</text>
    <text x="20" y="222" class="note">Planner 只能提计划，不能执行</text>
  </g>

  <g transform="translate(945 145)">
    <text x="20" y="0" class="stage">4 · 治理 Governance</text>
    <rect x="0" y="22" width="235" height="72" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="20" y="53" class="label">Policy Gate</text>
    <text x="20" y="76" class="body">允许执行或等待你的审批</text>
    <path d="M117 94 L117 122" class="inside"/>
    <rect x="0" y="136" width="235" height="92" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="20" y="171" class="label">Agent Router</text>
    <text x="20" y="197" class="body">按能力选择可用 Worker</text>
  </g>

  <g transform="translate(1240 145)">
    <text x="20" y="0" class="stage">5 · 执行与收敛</text>
    <rect x="0" y="22" width="260" height="72" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="20" y="53" class="label">Worker 执行任务</text>
    <text x="20" y="76" class="body">Pi / Codex / Claude / 自定义 Agent</text>
    <path d="M130 94 L130 122" class="inside"/>
    <rect x="0" y="136" width="260" height="72" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="20" y="167" class="label">Evidence + Verification</text>
    <text x="20" y="190" class="body">产物、回执、测试、验证</text>
    <path d="M130 208 L130 236" class="inside"/>
    <rect x="0" y="250" width="260" height="92" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="20" y="284" class="label">完成 / 失败 / 等待审批</text>
    <text x="20" y="310" class="body">完成后异步提出记忆候选</text>
  </g>

  <path d="M295 248 L345 248" class="edge"/>
  <path d="M590 248 L640 248" class="edge"/>
  <path d="M885 248 L935 248" class="edge"/>
  <path d="M1180 248 L1230 248" class="edge"/>

  <g transform="translate(70 510)">
    <rect x="0" y="0" width="1430" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="38" class="label">核心边界</text>
    <text x="28" y="69" class="body">Supervisor：拥有 Run 状态、权限、证据、验证与记忆治理。</text>
    <text x="28" y="98" class="body">Planner：只提出计划。Worker：只执行有边界的 WorkOrder。完成必须由 Verifier 依据证据判定。</text>
  </g>
</svg>
